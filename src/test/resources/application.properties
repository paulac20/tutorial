#Database
#URL de la base de datos (dónde está y cómo conectarse a ella). Mediante jdbc se conecta
#a una base de datos h2 en memoria llamada testdb
spring.datasource.url=jdbc:h2:mem:testdb
#Indica el usuari usado para conectarse y su contraseña asociada
spring.datasource.username=sa
spring.datasource.password=sa
#Indica qué driver jdbc se debe usar para conectarse a la base de datos
spring.datasource.driver-class-name=org.h2.Driver
#Indica que la base de datos que se usa es H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#Sirve para que primero se creen las tablas y luego se ejecuten los scripts de inicialización
spring.jpa.defer-datasource-initialization=true
